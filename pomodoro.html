<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沉浸番茄钟 - GEEK6S BOX</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0f1117] text-gray-100 min-h-screen flex">

    <!-- 左侧导航栏 -->
    <aside class="w-64 border-r border-gray-800 p-6 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="text-xl font-bold tracking-wider mb-8 text-white flex items-center gap-2">
                ⚡ GEEK6S BOX
            </div>
            <nav class="space-y-2">
                <a href="index.html"
                    class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">🔗
                    链接工具</a>
                <a href="pomodoro.html"
                    class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-blue-600 text-white font-medium shadow-lg shadow-blue-600/30">⏱️
                    沉浸番茄钟</a>
                <a href="password.html"
                    class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">🔐
                    强密码</a>
                <a href="fpv.html"
                    class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">🔋
                    FPV计算器</a>
                <a href="json.html"
                    class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">📦
                    JSON 格式化</a>
                <a href="feedback.html"
                    class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">💬
                    互动留言板</a>
            </nav>
        </div>
    </aside>

    <!-- 右侧主内容区 -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto flex flex-col items-center justify-center">
        <div
            class="max-w-md w-full bg-[#18181b] border border-gray-800 rounded-2xl p-8 shadow-2xl text-center space-y-8">
            <header>
                <h1 class="text-2xl font-bold">沉浸番茄钟</h1>
                <p class="text-sm text-gray-400 mt-1">保持专注，享受高效的自己。</p>
            </header>

            <!-- 模式切换 -->
            <div class="flex justify-center gap-2 bg-[#0f1117] p-1.5 rounded-xl border border-gray-800">
                <button onclick="switchMode('work')" id="btn-work"
                    class="flex-1 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white transition">专注
                    (25m)</button>
                <button onclick="switchMode('break')" id="btn-break"
                    class="flex-1 py-2 text-sm font-medium rounded-lg text-gray-400 hover:text-white transition">休息
                    (5m)</button>
            </div>

            <!-- 倒计时显示 -->
            <div id="timer-display" class="text-6xl font-mono font-bold tracking-wider text-blue-400 py-4">
                25:00
            </div>

            <!-- 控制按钮 -->
            <div class="flex gap-4">
                <button id="start-btn" onclick="toggleTimer()"
                    class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 font-medium rounded-xl transition text-white shadow-lg shadow-blue-600/30">开始专注</button>
                <button onclick="resetTimer()"
                    class="px-6 py-3 bg-gray-800 hover:bg-gray-700 font-medium rounded-xl transition text-gray-300">重置</button>
            </div>
        </div>
    </main>

    <!-- 引入全局搜索脚本 -->
    <script src="search.js"></script>
    <script>
        let totalSeconds = 25 * 60;
        let timer = null;
        let isRunning = false;
        let currentMode = 'work';

        const display = document.getElementById('timer-display');
        const startBtn = document.getElementById('start-btn');
        const btnWork = document.getElementById('btn-work');
        const btnBreak = document.getElementById('btn-break');

        function updateDisplay() {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            display.innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timer);
                isRunning = false;
                startBtn.innerText = '继续';
                startBtn.className = "flex-1 py-3 bg-blue-600 hover:bg-blue-500 font-medium rounded-xl transition text-white shadow-lg shadow-blue-600/30";
            } else {
                isRunning = true;
                startBtn.innerText = '暂停';
                startBtn.className = "flex-1 py-3 bg-yellow-600 hover:bg-yellow-500 font-medium rounded-xl transition text-white shadow-lg shadow-yellow-600/30";
                timer = setInterval(() => {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                        updateDisplay();
                    } else {
                        clearInterval(timer);
                        isRunning = false;
                        alert(currentMode === 'work' ? '专注时间到，休息一下吧！' : '休息结束，开始新一轮专注！');
                        startBtn.innerText = '开始专注';
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            totalSeconds = currentMode === 'work' ? 25 * 60 : 5 * 60;
            updateDisplay();
            startBtn.innerText = '开始专注';
            startBtn.className = "flex-1 py-3 bg-blue-600 hover:bg-blue-500 font-medium rounded-xl transition text-white shadow-lg shadow-blue-600/30";
        }

        function switchMode(mode) {
            clearInterval(timer);
            isRunning = false;
            currentMode = mode;
            startBtn.innerText = '开始专注';
            startBtn.className = "flex-1 py-3 bg-blue-600 hover:bg-blue-500 font-medium rounded-xl transition text-white shadow-lg shadow-blue-600/30";

            if (mode === 'work') {
                totalSeconds = 25 * 60;
                btnWork.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white transition";
                btnBreak.className = "flex-1 py-2 text-sm font-medium rounded-lg text-gray-400 hover:text-white transition";
            } else {
                totalSeconds = 5 * 60;
                btnBreak.className = "flex-1 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white transition";
                btnWork.className = "flex-1 py-2 text-sm font-medium rounded-lg text-gray-400 hover:text-white transition";
            }
            updateDisplay();
        }
    </script>
</body>

</html>
