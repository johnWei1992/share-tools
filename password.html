<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>强密码生成器 - GEEK6S BOX</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 Tailwind CSS 确保样式完美衔接 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0f1117] text-gray-100 min-h-screen flex">

    <!-- 左侧导航栏 (保持全站统一) -->
    <aside class="w-64 border-r border-gray-800 p-6 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="text-xl font-bold tracking-wider mb-8 text-white flex items-center gap-2">
                ⚡ GEEK6S BOX
            </div>
            <nav class="space-y-2">
                <a href="index.html"
                    class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">🔗
                    链接工具</a>
                <a href="pomodoro.html"
                    class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">⏱️
                    沉浸番茄钟</a>
                <a href="password.html"
                    class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-blue-600 text-white font-medium shadow-lg shadow-blue-600/30">🔐
                    强密码</a>
                <a href="fpv.html"
                    class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">🔋
                    FPV计算器</a>
                <a href="json.html"
                    class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">📦
                    JSON 格式化</a>
                <a href="feedback.html"
                    class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">💬
                    互动留言板</a>
            </nav>
        </div>
    </aside>

    <!-- 右侧主内容区 -->
    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        <header class="mb-8">
            <h1 class="text-2xl font-bold">本地随机强密码生成器</h1>
            <p class="text-sm text-gray-400 mt-1">基于浏览器原生安全随机数，生成绝不上传服务器的高强度密码。</p>
        </header>

        <div class="max-w-2xl bg-[#18181b] border border-gray-800 rounded-xl p-6 shadow-xl space-y-6">
            <!-- 密码长度控制 -->
            <div>
                <label class="block text-sm font-medium mb-2 text-gray-300">密码长度: <span id="length-val"
                        class="text-blue-400 font-bold">16</span></label>
                <input type="range" id="length-range" min="8" max="64" value="16"
                    class="w-full accent-blue-600 cursor-pointer">
            </div>

            <!-- 字符选项复选框 -->
            <div class="grid grid-cols-2 gap-4 text-sm text-gray-300">
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="inc-upper" checked
                        class="rounded bg-gray-900 border-gray-700 text-blue-600"> 包含大写字母 (A-Z)</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="inc-lower" checked
                        class="rounded bg-gray-900 border-gray-700 text-blue-600"> 包含小写字母 (a-z)</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="inc-num" checked
                        class="rounded bg-gray-900 border-gray-700 text-blue-600"> 包含数字 (0-9)</label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="inc-symbol" checked
                        class="rounded bg-gray-900 border-gray-700 text-blue-600"> 包含特殊符号 (!@#$)</label>
            </div>

            <!-- 生成按钮 -->
            <button onclick="generatePassword()"
                class="w-full py-3 bg-blue-600 hover:bg-blue-500 font-medium rounded-lg transition shadow-lg shadow-blue-600/20 text-white">
                瞬间生成安全密码
            </button>

            <!-- 结果显示区域 -->
            <div class="space-y-2">
                <div class="relative">
                    <input type="text" id="result-password" readonly
                        class="w-full bg-[#0f1117] border border-gray-800 rounded-lg py-3 px-4 text-mono text-lg text-blue-400 outline-none select-all"
                        placeholder="点击上方按钮生成">
                    <button onclick="copyPassword()"
                        class="absolute right-2 top-2 px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs rounded-md text-gray-300 transition">一键复制</button>
                </div>
                <!-- 强度指示条 -->
                <div class="flex items-center gap-2 text-xs text-gray-400 pt-1">
                    <span>密码强度：</span>
                    <div class="flex-1 h-2 bg-gray-800 rounded-full overflow-hidden flex">
                        <div id="strength-bar" class="h-full w-0 bg-red-500 transition-all duration-300"></div>
                    </div>
                    <span id="strength-text" class="font-medium text-gray-400">未生成</span>
                </div>
            </div>
        </div>
    </main>

    <!-- 引入全局搜索脚本 -->
    <script src="search.js"></script>
    <script>
        const lengthRange = document.getElementById('length-range');
        const lengthVal = document.getElementById('length-val');
        lengthRange.addEventListener('input', (e) => lengthVal.innerText = e.target.value);

        function generatePassword() {
            const length = parseInt(lengthRange.value);
            const upper = document.getElementById('inc-upper').checked;
            const lower = document.getElementById('inc-lower').checked;
            const num = document.getElementById('inc-num').checked;
            const symbol = document.getElementById('inc-symbol').checked;

            let chars = '';
            if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (lower) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (num) chars += '0123456789';
            if (symbol) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            if (!chars) {
                alert('请至少勾选一项字符类型！');
                return;
            }

            let password = '';
            const array = new Uint32Array(length);
            window.crypto.getRandomValues(array);
            for (let i = 0; i < length; i++) {
                password += chars[array[i] % chars.length];
            }

            document.getElementById('result-password').value = password;
            updateStrength(password);
        }

        function updateStrength(pwd) {
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            let score = 0;
            if (pwd.length >= 12) score++;
            if (pwd.length >= 16) score++;
            if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
            if (/[0-9]/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;

            if (score <= 2) {
                bar.style.width = '33%'; bar.className = 'h-full bg-red-500 transition-all duration-300'; text.innerText = '较弱'; text.className = 'text-red-500 font-medium';
            } else if (score <= 4) {
                bar.style.width = '66%'; bar.className = 'h-full bg-yellow-500 transition-all duration-300'; text.innerText = '中等'; text.className = 'text-yellow-500 font-medium';
            } else {
                bar.style.width = '100%'; bar.className = 'h-full bg-green-500 transition-all duration-300'; text.innerText = '极强 (军工级)'; text.className = 'text-green-500 font-medium';
            }
        }

        function copyPassword() {
            const pwdInput = document.getElementById('result-password');
            if (!pwdInput.value) return;
            navigator.clipboard.writeText(pwdInput.value);
            alert('密码已成功复制到剪贴板！');
        }

        // 默认生成一个
        generatePassword();
    </script>
    <script src="search.js"></script>
</body>

</html>
