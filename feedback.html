<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户反馈与建议 - GEEK6S BOX</title>
    <!-- 引入 Tailwind CSS 样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --apple-dark: #1d1d1f;
            --text-main: #333336;
            --text-muted: #86868b;
            --bg-main: #f5f5f7;
            --card-bg: #ffffff;
            --border-light: rgba(0, 0, 0, 0.06);
            --success-green: #34c759;
        }

        * {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .apple-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .apple-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .apple-input {
            width: 100%;
            background-color: #fbfbfd;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            color: var(--apple-dark);
            transition: all 0.2s ease;
            outline: none;
        }

        .apple-input:focus {
            background-color: #ffffff;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.12);
        }

        .apple-btn {
            background-color: var(--apple-blue);
            color: white;
            border-radius: 12px;
            padding: 12px 24px;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.2);
        }

        .apple-btn:hover {
            background-color: var(--apple-blue-hover);
            transform: translateY(-1px);
        }
    </style>
</head>

<body>

    <!-- 顶部导航栏 -->
    <header class="apple-nav py-4 px-8 flex justify-between items-center">
        <a href="index.html" class="text-base font-bold tracking-tight text-[var(--apple-dark)]">⚡ GEEK<span>6S</span>
            BOX</a>
        <a href="index.html"
            class="text-xs text-[var(--text-muted)] hover:text-[var(--apple-blue)] font-medium transition-colors">←
            返回极客工具箱</a>
    </header>

    <!-- 主体内容 -->
    <main class="max-w-2xl mx-auto px-4 py-12 flex-grow w-full">
        <article class="apple-card p-8 md:p-12">
            <header class="mb-8 border-b border-[var(--border-light)] pb-6 text-center">
                <h1 class="text-2xl md:text-3xl font-bold text-[var(--apple-dark)] mb-3 tracking-tight">客户反馈与建议</h1>
                <p class="text-sm text-[var(--text-muted)]">对工具有什么新想法、Bug 反馈或是合作需求？随时给我们留言。</p>
            </header>

            <!-- 
              提示：你可以去 https://formspree.io 注册免费账号，
              将 action 里的 "https://formspree.io/f/YOUR_FORM_ID" 替换成你自己的专属链接即可直接收取邮件。
            -->
            <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="space-y-6">
                <div>
                    <label
                        class="block text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-2">你的称呼
                        / 邮箱 (选填)</label>
                    <input type="text" name="_replyto" placeholder="例如: alex@example.com" class="apple-input">
                </div>

                <div>
                    <label
                        class="block text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-2">反馈类型</label>
                    <select name="category" class="apple-input">
                        <option value="feature">💡 新工具功能建议</option>
                        <option value="bug">🐛 Bug 错误反馈</option>
                        <option value="other">💬 其他意见与交流</option>
                    </select>
                </div>

                <div>
                    <label
                        class="block text-xs font-semibold uppercase tracking-wider text-[var(--text-muted)] mb-2">详细留言内容
                        <span class="text-red-500">*</span></label>
                    <textarea name="message" rows="5" required placeholder="请详细描述您的建议或遇到的问题..."
                        class="apple-input resize-none"></textarea>
                </div>

                <div>
                    <button type="submit" class="apple-btn">提交反馈</button>
                </div>
            </form>
        </article>
    </main>

    <!-- 页脚 -->
    <footer
        class="text-center py-8 text-xs text-[var(--text-muted)] border-t border-[var(--border-light)] mt-12 bg-white/50">
        © 2026 GEEK6S BOX. All Rights Reserved.
    </footer>

</body>

</html>
