<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEEK6S BOX - 极客工具箱与内嵌反馈系统</title>
    <!-- 引入 Tailwind CSS 样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --apple-dark: #1d1d1f;
            --text-main: #333336;
            --text-muted: #86868b;
            --bg-main: #f5f5f7;
            --card-bg: #ffffff;
            --border-light: rgba(0, 0, 0, 0.06);
            --success-green: #34c759;
        }

        * {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .apple-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .apple-card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .apple-input {
            width: 100%;
            background-color: #fbfbfd;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            color: var(--apple-dark);
            transition: all 0.2s ease;
            outline: none;
        }

        .apple-input:focus {
            background-color: #ffffff;
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        .apple-btn {
            background-color: var(--apple-blue);
            color: white;
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .apple-btn:hover {
            background-color: var(--apple-blue-hover);
        }
    </style>
</head>

<body>

    <!-- 顶部导航栏 -->
    <header class="apple-nav py-4 px-8 flex justify-between items-center">
        <a href="#" class="text-base font-bold tracking-tight text-[var(--apple-dark)]">⚡ GEEK<span>6S</span> BOX</a>
        <div class="text-xs text-[var(--text-muted)] font-medium">极客高效工具箱</div>
    </header>

    <!-- 主体内容区 -->
    <main class="max-w-3xl mx-auto px-4 py-10 flex-grow w-full space-y-12">

        <!-- 模块一：闪传助手 / 工具演示卡片 -->
        <section class="apple-card p-8">
            <h1 class="text-2xl font-bold text-[var(--apple-dark)] mb-2">闪传与二维码助手</h1>
            <p class="text-sm text-[var(--text-muted)] mb-6">快速生成二维码、条形码或缩短链接，支持多端自适应。</p>

            <!-- 工具交互区域 -->
            <div class="bg-[var(--bg-main)] p-6 rounded-xl border border-dashed border-gray-300 mb-6 text-center">
                <input type="text" placeholder="输入需要转换的网址或文本..." class="apple-input mb-4">
                <button class="apple-btn w-full">立即生成与转换</button>
            </div>

            <!-- 内嵌反馈与归类面板 -->
            <div class="border-t border-[var(--border-light)] pt-6">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-bold uppercase tracking-wider text-[var(--text-muted)]">💬
                        针对此工具的反馈留言板</span>
                    <span class="text-xs px-2 py-0.5 bg-blue-50 text-[var(--apple-blue)] rounded-full font-medium">归类：#
                        闪传助手</span>
                </div>
                <form onsubmit="handleFeedback(event, '闪传助手')" class="space-y-3">
                    <input type="text" placeholder="你的称呼 (可选)" class="apple-input text-xs">
                    <textarea rows="2" required placeholder="对这个工具有什么改进建议或遇到什么 Bug？"
                        class="apple-input text-xs resize-none"></textarea>
                    <div class="flex justify-end">
                        <button type="submit" class="apple-btn text-xs px-4 py-2">提交该模块反馈</button>
                    </div>
                </form>
                <!-- 实时展示该分组留言的容器 -->
                <div id="feedback-list-闪传助手" class="mt-4 space-y-2"></div>
            </div>
        </section>


        <!-- 模块二：沉浸番茄钟 -->
        <section class="apple-card p-8">
            <h1 class="text-2xl font-bold text-[var(--apple-dark)] mb-2">沉浸番茄钟</h1>
            <p class="text-sm text-[var(--text-muted)] mb-6">科学划分 25 分钟专注时间，告别拖延症。</p>

            <!-- 工具交互区域 -->
            <div class="bg-[var(--bg-main)] p-6 rounded-xl border border-dashed border-gray-300 mb-6 text-center">
                <div class="text-4xl font-ext500 text-[var(--apple-dark)] mb-3 tracking-widest">25:00</div>
                <button class="apple-btn w-full bg-[var(--success-green)] hover:bg-emerald-600">开始专注计时</button>
            </div>

            <!-- 内嵌反馈与归类面板 -->
            <div class="border-t border-[var(--border-light)] pt-6">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs font-bold uppercase tracking-wider text-[var(--text-muted)]">💬
                        针对此工具的反馈留言板</span>
                    <span
                        class="text-xs px-2 py-0.5 bg-emerald-50 text-[var(--success-green)] rounded-full font-medium">归类：#
                        沉浸番茄钟</span>
                </div>
                <form onsubmit="handleFeedback(event, '沉浸番茄钟')" class="space-y-3">
                    <input type="text" placeholder="你的称呼 (可选)" class="apple-input text-xs">
                    <textarea rows="2" required placeholder="对番茄钟计时、音效或功能有什么想法？"
                        class="apple-input text-xs resize-none"></textarea>
                    <div class="flex justify-end">
                        <button type="submit"
                            class="apple-btn text-xs px-4 py-2 bg-[var(--success-green)]">提交该模块反馈</button>
                    </div>
                </form>
                <!-- 实时展示该分组留言的容器 -->
                <div id="feedback-list-沉浸番茄钟" class="mt-4 space-y-2"></div>
            </div>
        </section>

    </main>

    <!-- 页脚 -->
    <footer
        class="text-center py-8 text-xs text-[var(--text-muted)] border-t border-[var(--border-light)] mt-12 bg-white/50">
        © 2026 GEEK6S BOX. All Rights Reserved.
    </footer>

    <!-- 简单的本地前端动态归类留言脚本（支持即时查看体验） -->
    <script>
        function handleFeedback(event, categoryName) {
            event.preventDefault();
            const form = event.target;
            const name = form.querySelector('input[type="text"]').value.trim() || '匿名极客';
            const message = form.querySelector('textarea').value.trim();

            if (!message) return;

            const container = document.getElementById(`feedback-list-${categoryName}`);
            const item = document.createElement('div');
            item.className = 'p-3 bg-gray-50 rounded-lg text-xs border border-gray-100 flex flex-col space-y-1';
            item.innerHTML = `
                <div class="flex justify-between text-gray-400">
                    <span class="font-semibold text-gray-700">${name}</span>
                    <span>刚刚</span>
                </div>
                <div class="text-gray-600">${message}</div>
            `;
            container.prepend(item);
            form.reset();
            alert(`成功提交到 [${categoryName}] 分组！`);
        }
    </script>
</body>

</html>
