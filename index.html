<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛸 GEEK6S BOX - 极速极客工具箱 & 链接转换中心</title>
    <!-- 引入 Tailwind CSS 样式库以完美呈现苹果风排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5158841818618377"
        crossorigin="anonymous"></script>
    <style>
        :root {
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --apple-dark: #1d1d1f;
            --text-main: #333336;
            --text-muted: #86868b;
            --bg-main: #f5f5f7;
            --card-bg: #ffffff;
            --border-light: rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1240px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        /* 侧边栏样式 - 苹果毛玻璃微调风格 */
        .sidebar {
            width: 280px;
            border-right: 1px solid var(--border-light);
            padding: 36px 24px;
            display: flex;
            flex-direction: column;
            background: #fafafa;
            flex-shrink: 0;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            color: var(--apple-dark);
            margin-bottom: 40px;
            letter-spacing: -0.3px;
        }

        .brand span {
            color: #34c759;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--text-main);
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .nav-item:hover {
            background-color: rgba(0, 0, 0, 0.04);
            color: var(--apple-dark);
        }

        .nav-item.active {
            background-color: var(--apple-blue);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25);
        }

        /* 主内容区样式 */
        .content {
            flex-grow: 1;
            padding: 48px;
            overflow-y: auto;
            background: #ffffff;
        }

        h1 {
            font-size: 26px;
            color: var(--apple-dark);
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        /* 通用表单与布局 */
        .input-area-group {
            margin-bottom: 24px;
        }

        .input-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--apple-dark);
            margin-bottom: 8px;
        }

        .input-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box-wrapper input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            background: #fbfbfd;
            color: var(--apple-dark);
        }

        .input-box-wrapper input:focus {
            border-color: var(--apple-blue);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.12);
        }

        .action-submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--apple-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.2);
        }

        .action-submit-btn:hover {
            background-color: var(--apple-blue-hover);
            transform: translateY(-1px);
        }

        /* 选项卡样式 */
        .tab-box-header {
            display: flex;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 28px;
            gap: 24px;
        }

        .tab-box-btn {
            padding: 10px 2px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-box-btn.active {
            color: var(--apple-blue);
            border-bottom-color: var(--apple-blue);
        }

        .tab-panel-content {
            display: none;
        }

        .tab-panel-content.active {
            display: block;
        }

        /* 结果展示区 */
        .result-display-panel {
            margin-top: 24px;
            padding: 20px;
            background-color: #f5f5f7;
            border: 1px dashed #d2d2d7;
            border-radius: 12px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* 广告容器 */
        .ads-container {
            margin-top: 40px;
            padding: 20px;
            background: #fbfbfd;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* 手机端响应式适配样式 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                flex-direction: column;
                border-radius: 16px;
            }

            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-light);
                padding: 24px 20px;
            }

            .brand {
                margin-bottom: 16px;
                text-align: center;
            }

            .nav-menu {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px;
                justify-content: center;
            }

            .nav-item {
                padding: 8px 12px;
                font-size: 13px;
                flex-grow: 1;
                text-align: center;
                justify-content: center;
            }

            .content {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- 左侧导航栏区域 -->
        <div class="sidebar">
            <div class="brand">🛸 GEEK<span>6S</span> BOX</div>
            <div class="nav-menu">
                <a href="index.html" class="nav-item active">🔗 链接工具</a>
                <a href="pomodoro.html" class="nav-item">⏱️ 沉浸番茄钟</a>
                <a href="password.html" class="nav-item">🔐 强密码</a>
                <a href="fpv.html" class="nav-item">🔋 FPV计算器</a>
                <a href="json.html" class="nav-item">📦 JSON 格式化</a>
                <a href="simulator.html" class="nav-item btn-simulator" target="_blank">🎮 极速模拟器</a>
                <a href="feedback.html" class="nav-item">💬 互动留言板</a>
            </div>
        </div>

        <!-- 右侧主内容区域 -->
        <div class="content">
            <h1 id="link-title">生成二维码</h1>
            <p class="subtitle" id="link-subtitle">将您的长链接转化为超清二维码，方便手机用户扫码直接访问。</p>

            <div class="tab-box-header">
                <div class="tab-box-btn active" onclick="switchLinkSubTab('qrcode', this)">二维码</div>
                <div class="tab-box-btn" onclick="switchLinkSubTab('barcode', this)">条形码</div>
                <div class="tab-box-btn" onclick="switchLinkSubTab('shorturl', this)">短网址</div>
            </div>

            <div class="tab-panel-content active" id="panel-qrcode">
                <div class="input-area-group">
                    <div class="input-label">输入您的原始长链接</div>
                    <div class="input-box-wrapper"><input type="text" placeholder="例如: http://example.com"></div>
                </div>
            </div>
            <div class="tab-panel-content" id="panel-barcode">
                <div class="input-area-group">
                    <div class="input-label">输入需要生成条形码的数字或文本</div>
                    <div class="input-box-wrapper"><input type="text" placeholder="例如: 123456789"></div>
                </div>
            </div>
            <div class="tab-panel-content" id="panel-shorturl">
                <div class="input-area-group">
                    <div class="input-label">输入需要缩短的长网址</div>
                    <div class="input-box-wrapper"><input type="text" placeholder="例如: http://very-long-url.com/path">
                    </div>
                </div>
            </div>

            <button class="action-submit-btn" onclick="executeLinkAction()">立即生成</button>
            <div class="result-display-panel" id="link-result">生成后的结果将安全地显示在这里</div>

            <div class="ads-container"><span>☕ GEEK6S 极客盒子 - 广告位预留</span></div>

            <!-- 底部声明区域 -->
            <footer
                style="margin-top: 48px; border-top: 1px solid var(--border-light); padding-top: 24px; text-align: center; font-size: 12px; color: var(--text-muted);">
                © 2026 GEEK6S BOX. All Rights Reserved. | <a href="privacy.html"
                    style="color: var(--text-muted); text-decoration: none; font-weight: 600;">关于我们 & 隐私政策</a>
            </footer>
        </div>
    </div>

    <!-- JavaScript 逻辑控制块 -->
    <script>
        let currentLinkSubTab = 'qrcode';

        function switchLinkSubTab(subTab, element) {
            currentLinkSubTab = subTab;
            document.querySelectorAll('.tab-box-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel-content').forEach(p => p.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('panel-' + subTab).classList.add('active');

            const titles = { qrcode: '生成二维码', barcode: '生成条形码', shorturl: '短网址生成' };
            const subtitles = { qrcode: '将您的长链接转化为超清二维码，方便手机直接扫描访问。', barcode: '快捷将特定纯文本或数字转化为国际标准的一维条形码结构。', shorturl: '缩短冗长的网址链路，生成便于传播的极简短外链链接。' };
            document.getElementById('link-title').innerText = titles[subTab];
            document.getElementById('link-subtitle').innerText = subtitles[subTab];
        }

        function executeLinkAction() {
            const panel = document.getElementById('panel-' + currentLinkSubTab);
            const inputVal = panel.querySelector('input').value;
            if (!inputVal) { alert('输入内容不能为空！'); return; }
            document.getElementById('link-result').innerHTML = `<strong>✨ 成功：</strong> 针对 [${inputVal}] 的数据操作已在本地完美就绪！（虚拟环境生成完毕）`;
        }
    </script>
    <script src="search.js"></script>
</body>

</html>
