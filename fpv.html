<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔋 FPV 计算器 - GEEK6S BOX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --apple-blue: #0071e3;
            --apple-dark: #1d1d1f;
            --text-main: #333336;
            --text-muted: #86868b;
            --bg-main: #f5f5f7;
            --card-bg: #ffffff;
            --border-light: rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1240px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .sidebar {
            width: 280px;
            border-right: 1px solid var(--border-light);
            padding: 36px 24px;
            display: flex;
            flex-direction: column;
            background: #fafafa;
            flex-shrink: 0;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            color: var(--apple-dark);
            margin-bottom: 40px;
        }

        .brand span {
            color: #34c759;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--text-main);
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s;
        }

        .nav-item:hover {
            background-color: rgba(0, 0, 0, 0.04);
            color: var(--apple-dark);
        }

        .nav-item.active {
            background-color: var(--apple-blue);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25);
        }

        .btn-simulator {
            margin-top: 16px;
            background: var(--apple-dark);
            color: white !important;
            justify-content: center;
            font-weight: 600;
        }

        .content {
            flex-grow: 1;
            padding: 48px;
            overflow-y: auto;
            background: #ffffff;
        }

        h1 {
            font-size: 26px;
            color: var(--apple-dark);
            margin-bottom: 6px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .fpv-grid-layout {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .input-area-group {
            margin-bottom: 24px;
        }

        .input-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--apple-dark);
            margin-bottom: 8px;
        }

        .input-box-wrapper input,
        .input-box-wrapper select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            background: #fbfbfd;
            color: var(--apple-dark);
        }

        .action-submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--apple-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.2);
        }

        .result-display-panel {
            margin-top: 24px;
            padding: 20px;
            background-color: #f5f5f7;
            border: 1px dashed #d2d2d7;
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <div class="brand">🛸 GEEK<span>6S</span> BOX</div>
            <div class="nav-menu">
                <a href="index.html" class="nav-item">🔗 链接工具</a>
                <a href="pomodoro.html" class="nav-item">⏱️ 沉浸番茄钟</a>
                <a href="password.html" class="nav-item">🔐 强密码</a>
                <a href="fpv.html" class="nav-item active">🔋 FPV计算器</a>
                <a href="json.html" class="nav-item">📦 JSON 格式化</a>
                <a href="feedback.html" class="nav-item">💬 互动留言板</a>
                <a href="simulator.html" class="nav-item btn-simulator" target="_blank">🎮 极速模拟器</a>
            </div>
        </div>
        <div class="content">
            <h1>🔋 FPV 航模物理参数推演箱</h1>
            <p class="subtitle">精准计算整机推重比、理论续航与电池起飞压降，拒绝盲目炸机。</p>
            <div class="fpv-grid-layout">
                <div class="input-area-group">
                    <div class="input-label">电池起飞电压 (V)</div>
                    <div class="input-box-wrapper">
                        <select id="fpv-voltage">
                            <option value="25.2">6S 满电 (25.2V)</option>
                            <option value="16.8">4S 满电 (16.8V)</option>
                            <option value="22.2">6S 标称 (22.2V)</option>
                        </select>
                    </div>
                </div>
                <div class="input-area-group">
                    <div class="input-label">整机全备重量 (包含电池/GoPro) (g)</div>
                    <div class="input-box-wrapper"><input type="number" id="fpv-weight" value="750"></div>
                </div>
                <div class="input-area-group">
                    <div class="input-label">单电机最大推力 (g)</div>
                    <div class="input-box-wrapper"><input type="number" id="fpv-thrust" value="1200"></div>
                </div>
                <div class="input-area-group">
                    <div class="input-label">电池电量容量 (mAh)</div>
                    <div class="input-box-wrapper"><input type="number" id="fpv-mah" value="1300"></div>
                </div>
            </div>
            <button class="action-submit-btn" onclick="calculateFpvPhysics()">启动多维数据推演</button>
            <div class="result-display-panel" id="fpv-result">点击按钮启动多维参数物理推演...</div>
        </div>
    </div>
    <script>
        function calculateFpvPhysics() {
            const voltage = parseFloat(document.getElementById('fpv-voltage').value);
            const weight = parseFloat(document.getElementById('fpv-weight').value);
            const thrust = parseFloat(document.getElementById('fpv-thrust').value);
            const mah = parseFloat(document.getElementById('fpv-mah').value);
            if (!weight || !thrust || !mah) { alert('请填写完整的物理参数！'); return; }
            const totalThrust = thrust * 4;
            const twr = totalThrust / weight;
            const hoverCurrent = (weight / 100) * 4.5;
            const minutes = (mah / 1000) / hoverCurrent * 60;
            document.getElementById('fpv-result').innerHTML = `
                🚀 <b>多维推演报告已就绪：</b><br>
                • 💥 <b>全机整机推重比：</b> <span style="color:#34c759; font-weight:bold;">${twr.toFixed(2)} : 1</span><br>
                • 🕒 <b>理论极限悬停时间：</b> 约 ${minutes.toFixed(1)} 分钟<br>
                • ⚡ <b>电池起飞基准电压：</b> ${voltage}V 运行正常
            `;
        }
    </script>
    <script src="search.js"></script>
</body>

</html>
