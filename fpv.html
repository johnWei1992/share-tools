<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛸 GEEK6S 3D SIMULATOR - 强聚焦完美控制版</title>
    <!-- 引入轻量级 3D 引擎 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --apple-dark: #1d1d1f;
            --text-main: #333336;
            --text-muted: #86868b;
            --bg-main: #f5f5f7;
            --card-bg: #ffffff;
            --border-light: rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .header-nav {
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            position: sticky;
            top: 0;
        }

        .brand-logo {
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            color: var(--apple-dark);
            letter-spacing: -0.3px;
        }

        .brand-logo span {
            color: #34c759;
        }

        .back-link {
            text-decoration: none;
            font-size: 13px;
            color: var(--apple-blue);
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.75;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            margin: 32px auto 0 auto;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            padding: 32px;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .game-card {
            background: #000000;
            border-radius: 16px;
            height: 480px;
            position: relative;
            overflow: hidden;
            outline: none;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: none;
        }

        .menu-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            background: rgba(29, 29, 31, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
            padding: 30px;
        }

        .game-title {
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .game-subtitle {
            font-size: 14px;
            color: #a1a1a6;
            margin-bottom: 28px;
        }

        .btn-action {
            padding: 14px 36px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
        }

        .btn-start {
            background: var(--apple-blue);
        }

        .btn-start:hover {
            background: var(--apple-blue-hover);
            transform: translateY(-1px);
        }

        /* 十字操控面板 (苹果简约微调风) */
        .control-panel {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .row {
            display: flex;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }

        .btn-dir {
            width: 32%;
            max-width: 160px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--apple-dark);
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            cursor: pointer;
            background: #fbfbfd;
            user-select: none;
            transition: all 0.15s ease;
        }

        .btn-dir:active,
        .btn-dir:hover {
            background: #e8e8ed;
            border-color: #86868b;
        }

        .hud-display {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #34c759;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 14px;
            text-align: left;
            pointer-events: none;
            display: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .countdown-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 72px;
            font-weight: 700;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            pointer-events: none;
            display: none;
            z-index: 20;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .linkage-hint {
            margin-top: 20px;
            padding: 16px;
            background: #fbfbfd;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-main);
            text-align: left;
            line-height: 1.5;
        }

        .btn-share {
            background: var(--apple-dark);
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 8px;
            border: none;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-share:hover {
            background: #333336;
        }

        @media (max-width: 768px) {
            .header-nav {
                padding: 14px 20px;
            }

            .game-container {
                margin: 16px 12px;
                padding: 16px;
                width: auto;
            }

            .game-card {
                height: 360px;
            }
        }
    </style>
</head>

<body>

    <div class="header-nav">
        <a href="index.html" class="brand-logo">🛸 GEEK<span>6S</span> 3D WIDE</a>
        <a href="index.html" class="back-link">返回极客工具箱 ➔</a>
    </div>

    <div class="game-container">
        <!-- tabindex保证可以使用边缘物理聚焦 -->
        <div class="game-card" id="stage-box" tabindex="1">
            <div id="canvas3d"></div>
            <div class="hud-display" id="hud">
                <div>ALT: <span id="hud-alt">0.0</span>m</div>
                <div>TWR: <span id="hud-twr">6.0</span>:1</div>
                <div>SCORE: <span id="hud-score">0</span>m</div>
            </div>
            <div class="countdown-overlay" id="countdown">3</div>
            <div class="menu-view" id="menu-view">
                <div class="game-title" id="m-title">🛸 6S 3D 动态曲折隧道模拟器</div>
                <div class="game-subtitle" id="physics-status">正在读取计算器核心推演参数...</div>
                <button class="btn-action btn-start" onclick="startPreFlight()">⚡ 3D 模式安全起飞</button>
            </div>
        </div>

        <!-- 操控区 -->
        <div class="control-panel">
            <div class="row">
                <button class="btn-dir" id="btn-up">▲ 爬升 (↑ / W)</button>
            </div>
            <div class="row">
                <button class="btn-dir" id="btn-left">◀ 左移 (← / A)</button>
                <button class="btn-dir" id="btn-right">右移 (→ / D) ▶</button>
            </div>
            <div class="row">
                <button class="btn-dir" id="btn-down">▼ 俯冲 (↓ / S)</button>
            </div>
        </div>

        <div class="linkage-hint">
            <strong>⚙️ 3D 连续弯道操控指引：</strong><br>
            <span id="linkage-text">已全面升级全局键盘映射。若无反应，请确保未开启中文输入法。</span><br>
            <button class="btn-share" id="share-btn" style="display:none;" onclick="copyMyScore()">📋
                一键复制硬核战绩破圈</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, droneGroup;
        let tunnelRings = [];
        let gameActive = false;
        let flyDistance = 0;
        let twr = 6.0;
        let moveSens = 0.6;
        let speedZ = 2.2;
        let globalRingCount = 0;

        // 全局按键映射状态字典
        let keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        function refreshTwrData() {
            try {
                const savedTwr = localStorage.getItem('fpv_twr');
                if (savedTwr && !isNaN(parseFloat(savedTwr))) {
                    twr = parseFloat(savedTwr);
                }
            } catch (e) { }
            document.getElementById('physics-status').innerText = `已同步6S动力箱：当前立体物理推重比为 ${twr.toFixed(1)}:1`;
            moveSens = twr >= 8.0 ? 0.95 : (twr < 4.0 ? 0.40 : 0.65);
        }
        refreshTwrData();

        // 绑定至顶级 window 窗口，彻底解决局部不响应焦点的问题
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyS', 'KeyA', 'KeyD'].includes(e.code)) {
                e.preventDefault(); // 阻止方向键滚网页

                if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.ArrowUp = true;
                if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.ArrowDown = true;
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = true;
                if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = true;
            }
        }, { passive: false });

        window.addEventListener('keyup', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyS', 'KeyA', 'KeyD'].includes(e.code)) {
                e.preventDefault();

                if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.ArrowUp = false;
                if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.ArrowDown = false;
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = false;
                if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = false;
            }
        }, { passive: false });

        // 移动端/鼠标模拟控制
        const bindBtn = (id, keyName) => {
            const btn = document.getElementById(id);
            btn.addEventListener('mousedown', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('mouseup', () => keys[keyName] = false);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', () => keys[keyName] = false);
        };
        bindBtn('btn-up', 'ArrowUp');
        bindBtn('btn-down', 'ArrowDown');
        bindBtn('btn-left', 'ArrowLeft');
        bindBtn('btn-right', 'ArrowRight');

        function startPreFlight() {
            refreshTwrData();

            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('canvas3d').style.display = 'block';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('share-btn').style.display = 'none';

            setTimeout(() => {
                const sb = document.getElementById('stage-box');
                if (sb) sb.focus();
            }, 50);

            flyDistance = 0;
            tunnelRings = [];
            globalRingCount = 0;
            keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
            document.getElementById('hud-score').innerText = flyDistance;
            document.getElementById('hud-twr').innerText = twr.toFixed(1);

            const container = document.getElementById('canvas3d');
            container.innerHTML = '';

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0c);
            scene.fog = new THREE.FogExp2(0x0a0a0c, 0.012);

            camera = new THREE.PerspectiveCamera(110, container.clientWidth / 480, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, 480);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0x34c759, 1.2);
            dirLight.position.set(20, 50, 20);
            scene.add(dirLight);

            // 战机模型
            droneGroup = new THREE.Group();
            const bodyGeo = new THREE.ConeGeometry(1.2, 4.5, 4);
            bodyGeo.rotateX(Math.PI / 2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0071e3, roughness: 0.1, metalness: 0.5 });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            droneGroup.add(bodyMesh);

            const wingGeo = new THREE.BoxGeometry(4.8, 0.15, 1.0);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0x34c759 });
            const wingMesh = new THREE.Mesh(wingGeo, wingMat);
            wingMesh.position.set(0, 0, 0.2);
            droneGroup.add(wingMesh);

            droneGroup.position.set(0, 0, 0);
            scene.add(droneGroup);

            updateCameraPosition(true);
            generateInitialTunnel();

            const countdownEl = document.getElementById('countdown');
            countdownEl.style.display = 'block';
            let count = 3;
            countdownEl.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) { countdownEl.innerText = count; }
                else if (count === 0) { countdownEl.innerText = "GO!"; }
                else {
                    clearInterval(timer);
                    countdownEl.style.display = 'none';
                    gameActive = true;
                    animate();
                }
            }, 1000);
        }

        function updateCameraPosition(immediate = false) {
            let targetCamX = droneGroup.position.x;
            let targetCamY = droneGroup.position.y + 6.5;
            let targetCamZ = droneGroup.position.z + 22.0;

            if (immediate) {
                camera.position.set(targetCamX, targetCamY, targetCamZ);
            } else {
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetCamX, 0.15);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, targetCamY, 0.15);
                camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetCamZ, 0.15);
            }
            camera.lookAt(droneGroup.position.x, droneGroup.position.y + 0.3, droneGroup.position.z - 20);
        }

        function generateInitialTunnel() {
            let startZ = -10;
            for (let i = 0; i < 50; i++) {
                createTunnelRing(startZ);
                startZ -= 8;
            }
        }

        function createTunnelRing(zPos) {
            globalRingCount++;
            let ringX = 0;
            let ringY = 0;

            if (globalRingCount > 4) {
                let curveIndex = globalRingCount - 4;
                ringX = Math.sin(curveIndex * 0.13) * 16.0;
                ringY = Math.cos(curveIndex * 0.09) * 11.0;
            }

            const geometry = new THREE.TorusGeometry(11, 0.35, 8, 24);
            let ringColor = globalRingCount % 2 === 0 ? 0x34c759 : 0x0071e3;
            const material = new THREE.MeshStandardMaterial({
                color: ringColor,
                emissive: ringColor,
                emissiveIntensity: 0.4,
                roughness: 0.4
            });

            const ring = new THREE.Mesh(geometry, material);
            ring.position.set(ringX, ringY, zPos);
            scene.add(ring);
            tunnelRings.push(ring);
        }

        function animate() {
            if (!gameActive) return;

            requestAnimationFrame(animate);

            let moveX = 0;
            let moveY = 0;

            if (keys.ArrowUp) { moveY += moveSens; droneGroup.rotation.x = THREE.MathUtils.lerp(droneGroup.rotation.x, -0.28, 0.1); }
            if (keys.ArrowDown) { moveY -= moveSens; droneGroup.rotation.x = THREE.MathUtils.lerp(droneGroup.rotation.x, 0.28, 0.1); }
            if (keys.ArrowLeft) { moveX -= moveSens; droneGroup.rotation.z = THREE.MathUtils.lerp(droneGroup.rotation.z, 0.35, 0.1); }
            if (keys.ArrowRight) { moveX += moveSens; droneGroup.rotation.z = THREE.MathUtils.lerp(droneGroup.rotation.z, -0.35, 0.1); }

            if (!keys.ArrowUp && !keys.ArrowDown) droneGroup.rotation.x = THREE.MathUtils.lerp(droneGroup.rotation.x, 0, 0.1);
            if (!keys.ArrowLeft && !keys.ArrowRight) droneGroup.rotation.z = THREE.MathUtils.lerp(droneGroup.rotation.z, 0, 0.1);

            droneGroup.position.x += moveX;
            droneGroup.position.y += moveY;
            droneGroup.position.z -= speedZ;

            flyDistance += 2;
            document.getElementById('hud-score').innerText = flyDistance;
            document.getElementById('hud-alt').innerText = (droneGroup.position.y + 20).toFixed(1);

            updateCameraPosition();

            let closestRing = null;
            let minDistZ = 999;

            for (let i = 0; i < tunnelRings.length; i++) {
                let ring = tunnelRings[i];
                let distZ = Math.abs(droneGroup.position.z - ring.position.z);

                if (distZ < minDistZ) {
                    minDistZ = distZ;
                    closestRing = ring;
                }

                if (ring.position.z > droneGroup.position.z + 25) {
                    scene.remove(ring);
                    tunnelRings.splice(i, 1);
                    i--;
                    let furthestZ = tunnelRings.length > 0 ? tunnelRings[tunnelRings.length - 1].position.z : droneGroup.position.z;
                    createTunnelRing(furthestZ - 8);
                }
            }

            if (closestRing && minDistZ <= 2.2) {
                let dronePos2D = new THREE.Vector2(droneGroup.position.x, droneGroup.position.y);
                let ringPos2D = new THREE.Vector2(closestRing.position.x, closestRing.position.y);
                let distToCenter = dronePos2D.distanceTo(ringPos2D);

                if (distToCenter < 10.4) {
                    closestRing.material.color.setHex(0x34c759);
                } else {
                    closestRing.material.color.setHex(0xff3b30);
                    triggerGameOver("💥 弯道切弯失败！飞机狠狠撞上隧道内壁！");
                    return;
                }
            }

            renderer.render(scene, camera);
        }

        function triggerGameOver(reason) {
            gameActive = false;
            document.getElementById('menu-view').style.display = 'flex';
            document.getElementById('canvas3d').style.display = 'none';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('share-btn').style.display = 'inline-block';

            document.getElementById('m-title').innerHTML = `<span style="color:#ff3b30">${reason}</span>`;
            document.getElementById('linkage-text').innerHTML = `🏆 曲折冲刺结束！你在这条动态时空隧道中顽强穿梭了 <b>${flyDistance}</b> 米！当前使用的是来自主站 ${twr.toFixed(1)}:1 的动态物理参数。`;

            document.querySelector('.btn-start').innerText = '🔄 重新安全起飞';
        }

        function copyMyScore() {
            const text = `🛸 兄弟们！在 GEEK6S 3D 动态曲折隧道里，我顶着 ${twr.toFixed(1)}:1 的暴力全向动力狂飞了 ${flyDistance} 米！这曲折隧道的推背感太炸裂了，快来挑战：geek6s.com`;
            navigator.clipboard.writeText(text).then(() => {
                alert('战绩已复制！');
            }).catch(() => {
                alert('复制失败：' + text);
            });
        }
    </script>
    <script src="search.js"></script>
</body>

</html>
